<text x="40" y="52" text-anchor="start" font-size="17" fill="#ece7de">전신샷 한 장에서 리깅된 3D 캐릭터까지</text><rect x="30" y="110" width="160" height="64" rx="6" fill="none" stroke="#ffb35c" stroke-width="1.5"/><text x="110.0" y="134.0" text-anchor="middle" font-size="19" fill="#ffb35c">전신샷 한 장</text><text x="110.0" y="158.0" text-anchor="middle" font-size="15" fill="#8d877c">입력</text><rect x="240" y="110" width="220" height="64" rx="6" fill="none" stroke="#4a453d" stroke-width="1.5"/><text x="350.0" y="134.0" text-anchor="middle" font-size="19" fill="#ece7de">파츠 이미지 생성</text><text x="350.0" y="158.0" text-anchor="middle" font-size="15" fill="#8d877c">전신샷 → 파츠 이미지</text><rect x="240" y="300" width="220" height="64" rx="6" fill="none" stroke="#4a453d" stroke-width="1.5"/><text x="350.0" y="324.0" text-anchor="middle" font-size="19" fill="#ece7de">3D 에셋 생성</text><text x="350.0" y="348.0" text-anchor="middle" font-size="15" fill="#8d877c">파츠 이미지 → 3D 에셋</text><rect x="520" y="300" width="220" height="64" rx="6" fill="none" stroke="#4a453d" stroke-width="1.5"/><text x="630.0" y="324.0" text-anchor="middle" font-size="19" fill="#ece7de">모델 편집</text><text x="630.0" y="348.0" text-anchor="middle" font-size="15" fill="#8d877c">3D 에셋 → 웹에서 편집</text><rect x="520" y="110" width="220" height="64" rx="6" fill="none" stroke="#4a453d" stroke-width="1.5"/><text x="630.0" y="134.0" text-anchor="middle" font-size="19" fill="#ece7de">얼굴 리깅</text><text x="630.0" y="158.0" text-anchor="middle" font-size="15" fill="#8d877c">얼굴 메시 → 블렌드셰이프</text><line x1="190" y1="142" x2="237" y2="142" stroke="#8d877c" stroke-width="1.5" marker-end="url(#a)"/><line x1="350" y1="174" x2="350" y2="297" stroke="#8d877c" stroke-width="1.5" marker-end="url(#a)"/><line x1="460" y1="332" x2="517" y2="332" stroke="#8d877c" stroke-width="1.5" marker-end="url(#a)"/><line x1="630" y1="300" x2="630" y2="177" stroke="#8d877c" stroke-width="1.5" marker-end="url(#a)"/><text x="630" y="215" text-anchor="middle" font-size="12" fill="#8d877c"></text><text x="760" y="142" font-size="15" fill="#ffb35c" text-anchor="end"></text><text x="630" y="420" text-anchor="middle" font-size="15" fill="#ffb35c">ARKit 블렌드셰이프 51종</text><text x="240" y="420" text-anchor="start" font-size="15" fill="#8d877c">기능마다 독립된 페이지</text>
