<text x="40" y="52" text-anchor="start" font-size="17" fill="#ece7de">음성 · 텍스트에서 얼굴 애니메이션까지</text><rect x="30" y="200" width="150" height="80" rx="6" fill="none" stroke="#4a453d" stroke-width="1.5"/><text x="105.0" y="232.0" text-anchor="middle" font-size="19" fill="#ece7de">음성 · 텍스트</text><text x="105.0" y="256.0" text-anchor="middle" font-size="15" fill="#8d877c">입력</text><rect x="225" y="200" width="150" height="80" rx="6" fill="none" stroke="#ffb35c" stroke-width="1.5"/><text x="300.0" y="232.0" text-anchor="middle" font-size="19" fill="#ffb35c">viseme</text><text x="300.0" y="256.0" text-anchor="middle" font-size="15" fill="#8d877c">15칸 공통 표현</text><rect x="420" y="200" width="160" height="80" rx="6" fill="none" stroke="#4a453d" stroke-width="1.5"/><text x="500.0" y="232.0" text-anchor="middle" font-size="19" fill="#ece7de">조음 파라미터</text><text x="500.0" y="256.0" text-anchor="middle" font-size="15" fill="#8d877c">입 모양을 잇는 층</text><rect x="625" y="200" width="150" height="80" rx="6" fill="none" stroke="#4a453d" stroke-width="1.5"/><text x="700.0" y="232.0" text-anchor="middle" font-size="19" fill="#ece7de">블렌드셰이프</text><text x="700.0" y="256.0" text-anchor="middle" font-size="15" fill="#8d877c">얼굴 메시</text><line x1="180" y1="240" x2="222" y2="240" stroke="#8d877c" stroke-width="1.5" marker-end="url(#a)"/><line x1="375" y1="240" x2="417" y2="240" stroke="#8d877c" stroke-width="1.5" marker-end="url(#a)"/><line x1="580" y1="240" x2="622" y2="240" stroke="#8d877c" stroke-width="1.5" marker-end="url(#a)"/><path d="M300 200 C300 120 700 120 700 197" fill="none" stroke="#8d877c" stroke-width="1.5" marker-end="url(#a)"/><text x="500" y="128" text-anchor="middle" font-size="15" fill="#8d877c">Unity · viseme에서 블렌드셰이프로</text><path d="M300 280 C300 350 500 350 500 283" fill="none" stroke="#8d877c" stroke-width="1.5" marker-end="url(#a)"/><text x="400" y="368" text-anchor="middle" font-size="15" fill="#8d877c">Godot · 조음 파라미터 층을 거쳐</text><text x="40" y="460" text-anchor="start" font-size="15" fill="#8d877c">입 모양이 끊기지 않고 이어지도록</text>
